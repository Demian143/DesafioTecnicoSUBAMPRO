services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: desafio_subampro
      DB_USERNAME: laravel
      DB_PASSWORD: laravel
    volumes:
      - ./backend:/var/www/html
      - laravel_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "php artisan migrate --seed --force && php artisan serve --host=0.0.0.0 --port=8000"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: desafio_subampro
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: laravel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d desafio_subampro"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:5
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  laravel_vendor:
